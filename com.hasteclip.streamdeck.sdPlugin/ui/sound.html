<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Sound</title>
		<!-- sdpi-components v4.0.1 (MIT), kept here so it works offline: https://sdpi-components.dev -->
		<script src="sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Sound">
			<sdpi-select setting="sound" label-setting="soundName" datasource="sounds" hot-reload loading="Asking HasteClip…" placeholder="Pick a sound"></sdpi-select>
		</sdpi-item>
		<sdpi-item label="A key press">
			<sdpi-select setting="press" default="toggle">
				<option value="toggle">Mutes or unmutes</option>
				<option value="talk">Unmutes while held</option>
				<option value="mute">Mutes while held</option>
			</sdpi-select>
		</sdpi-item>
	</body>
</html>

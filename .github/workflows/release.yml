# Release: push a tag vX.Y.Z, the version in package.json and in the
# manifest (X.Y.Z.0; `npm version` keeps them in step). The plugin is
# tested, built, checked and packed twice:
#
# - For GitHub: published as this tag's release, with
#   com.hasteclip.streamdeck.streamDeckPlugin on it. It carries
#   bin/updates.json (this repo, this version), so installed copies update
#   from the releases (src/update.ts).
# - For the Elgato Marketplace: the same without bin/updates.json, which the
#   Marketplace keeps up to date itself. It's kept on the workflow run as
#   "marketplace", to upload in Maker Console.
#
# Windows, where the Stream Deck CLI's packing is known to work.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: The tag is the version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package=$(node -p "require('./package.json').version")
          manifest=$(node -p "require('./com.hasteclip.streamdeck.sdPlugin/manifest.json').Version")
          [ "$package" = "$tag" ] || { echo "package.json says $package, the tag $tag"; exit 1; }
          [ "$manifest" = "$tag.0" ] || { echo "the manifest says $manifest, the tag $tag"; exit 1; }
      - run: npm run build
      - run: npx streamdeck validate com.hasteclip.streamdeck.sdPlugin
      - name: Pack for the Marketplace
        run: npx streamdeck pack com.hasteclip.streamdeck.sdPlugin --output dist/marketplace --force
      - name: Pack for GitHub (updates from this repo's releases)
        shell: bash
        run: |
          echo "{\"repo\":\"$GITHUB_REPOSITORY\",\"version\":\"${GITHUB_REF_NAME#v}\"}" > com.hasteclip.streamdeck.sdPlugin/bin/updates.json
          npx streamdeck pack com.hasteclip.streamdeck.sdPlugin --output dist --force
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace
          path: dist/marketplace/com.hasteclip.streamdeck.streamDeckPlugin
          if-no-files-found: error
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/com.hasteclip.streamdeck.streamDeckPlugin --title "HasteClip for Stream Deck ${GITHUB_REF_NAME#v}" --generate-notes
